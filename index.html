<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#11142f" />
    <meta name="description" content="记忆档案馆，把日常碎片，存进岁月里。" />
    <title>记忆档案馆 · Archive of Memories</title>
    <link rel="icon" type="image/webp" href="assets/logo.webp" />
    <link rel="preload" href="assets/background.webp" as="image" />
    <link rel="preload" href="assets/logo.webp" as="image" fetchpriority="high" />
    <link rel="stylesheet" href="site.90b4c0740c.css" />
    
    
    <script src="site.d719b7f77b.js" defer></script>
    
    
    
    
  </head>
  <body>
    <svg class="svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h15M13 5l7 7-7 7" /></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M20 12H5m6-7-7 7 7 7" /></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20v-2a7 7 0 0 1 14 0v2" /></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2" /></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="m3 3 18 18M10.6 5.1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-3.2 4.1M6.2 6.2A19 19 0 0 0 2 12s3.5 7 10 7c1.8 0 3.4-.5 4.8-1.3M10 10a2.8 2.8 0 0 0 4 4"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7" /></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6" /></symbol>
      <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 2 2.6 7.4L22 12l-7.4 2.6L12 22l-2.6-7.4L2 12l7.4-2.6L12 2Z" /></symbol>
      <symbol id="i-replay" viewBox="0 0 24 24"><path d="M4 9a8 8 0 1 1 0 7M4 3v6h6" /></symbol>
    </svg>
    <div class="world" aria-hidden="true"><div class="world-image"></div><div class="world-shade"></div><div class="world-halo"></div></div>
    <main class="experience" id="experience" data-scene="intro" aria-label="记忆档案馆">
      <div class="glass-reflection" aria-hidden="true"></div>
      <header class="shell-top">
        <button class="wordmark" type="button" data-go="welcome" aria-label="回到记忆档案馆欢迎页">
          <img src="assets/logo.webp" alt="" width="36" height="36" />
          <span>记忆档案馆<small>ARCHIVE OF MEMORIES</small></span>
        </button>
        <span class="top-note"><span class="status-dot"></span>每一刻，都值得被记得</span>
        <button class="replay icon-button" id="replay" type="button" data-go="intro" aria-label="重新播放开场" title="重新播放开场"><svg><use href="#i-replay"/></svg></button>
      </header>
      <div class="stage">
        <div class="particles" id="particles" aria-hidden="true"></div>
        <div class="hero-logo" aria-hidden="true"><div class="logo-aura"></div><div class="logo-float"><img src="assets/logo.webp" alt="" width="400" height="400" draggable="false" /></div><div class="logo-shadow"></div></div>
        <section class="scene intro-scene is-active" id="intro" aria-labelledby="intro-title">
          <div class="intro-caption"><p class="eyebrow">EVERY MOMENT MATTERS</p><h1 id="intro-title" tabindex="-1">让记忆，有处安放</h1><div class="intro-progress" aria-hidden="true"><span></span></div></div>
          <button class="text-button skip-intro" type="button" data-go="welcome">跳过开场<svg><use href="#i-arrow"/></svg></button>
        </section>
        <section class="scene welcome-scene" id="welcome" aria-labelledby="welcome-title" aria-hidden="true" inert>
          <div class="welcome-copy">
            <p class="eyebrow reveal-item" style="--order:0"><span class="tiny-star">✧</span> 在这里，与每一刻重逢</p>
            <h1 class="welcome-title reveal-item" id="welcome-title" tabindex="-1" style="--order:1">记忆档案馆</h1>
            <p class="english-title reveal-item" style="--order:2">Archive of Memories</p>
            <div class="welcome-rule reveal-item" style="--order:3"></div>
            <p class="welcome-description reveal-item" style="--order:3">把日常碎片，存进岁月里。<br/><span>让那些微小而珍贵的瞬间，有迹可循。</span></p>
            <button class="primary-button welcome-cta reveal-item" style="--order:4" type="button" data-go="login"><span>开启记忆之旅</span><svg><use href="#i-arrow"/></svg></button>
            <p class="welcome-footnote reveal-item" style="--order:5"><span class="small-line"></span> 属于你的故事，从这里开始</p>
          </div>
        </section>
        <section class="scene login-scene" id="login" aria-labelledby="login-title" aria-hidden="true" inert>
          <div class="login-layout">
            <div class="login-content">
              <button class="text-button back-button reveal-item" type="button" data-go="welcome" style="--order:0"><svg><use href="#i-back"/></svg>返回</button>
              <div class="login-heading reveal-item" style="--order:1"><p class="eyebrow">A SPACE FOR YOUR MEMORIES</p><h1 id="login-title" tabindex="-1">欢迎使用记忆档案馆</h1><p>再次相遇，让记忆继续。</p></div>
              <form id="login-form" novalidate class="reveal-item" style="--order:2">
                <div class="field-group" id="username-group"><label for="username">用户名</label><div class="input-shell"><svg class="field-icon"><use href="#i-user"/></svg><input id="username" name="username" type="text" autocomplete="username" placeholder="请输入用户名" maxlength="32" aria-describedby="username-error" spellcheck="false" /></div><p class="field-error" id="username-error" aria-live="polite"></p></div>
                <div class="field-group" id="password-group"><label for="password">密码</label><div class="input-shell"><svg class="field-icon"><use href="#i-lock"/></svg><input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" maxlength="128" aria-describedby="password-error" /><button type="button" class="password-toggle icon-button" id="toggle-password" aria-label="显示密码" aria-pressed="false"><svg><use href="#i-eye"/></svg></button></div><p class="field-error" id="password-error" aria-live="polite"></p></div>
                <div class="account-links"><button type="button" class="text-link" data-dialog="register">立即注册<svg><use href="#i-arrow"/></svg></button><button type="button" class="text-link muted-link" data-dialog="forgot">忘记密码？</button></div>
                <button type="submit" class="primary-button login-submit" id="login-submit"><span class="button-text">开始使用</span><span class="button-trailing"><svg class="submit-arrow"><use href="#i-arrow"/></svg><span class="spinner" aria-hidden="true"></span></span></button>
                <div class="consent-block" id="consent-group"><div class="consent-row"><input id="consent" type="checkbox" aria-describedby="consent-error" /><label for="consent">我已阅读并同意</label><button type="button" class="inline-link" data-dialog="terms">用户协议</button><span>与</span><button type="button" class="inline-link" data-dialog="privacy">隐私政策</button></div><p class="field-error" id="consent-error" aria-live="polite"></p></div>
                <p class="demo-note"><svg><use href="#i-lock"/></svg>交互演示 · 无需填写账号，可直接开始使用</p>
                <p id="form-status" class="sr-only" role="status" aria-live="polite"></p>
              </form>
            </div>
            <div class="login-divider" aria-hidden="true"></div>
            <aside class="orb-side" aria-label="记忆星球装饰">
              <div class="orb-visual"><div class="orb-halo"></div><div class="orb-parallax"><img class="orb-image" src="assets/orb.webp" loading="lazy" decoding="async" fetchpriority="low" alt="紫蓝色光点汇成的记忆星球" width="700" height="700" draggable="false" /></div><span class="orb-spark spark-one">✦</span><span class="orb-spark spark-two">✧</span></div>
              <div class="orb-caption"><div class="orb-caption-line"></div><p>让记忆，不止于想起</p><span>珍藏此刻 · 重逢往昔</span></div>
            </aside>
          </div>
        </section>
      </div>
      <footer class="shell-bottom"><p class="footer-poem">拾起微光，收藏日常。</p><nav class="scene-nav" aria-label="页面导航"><span class="nav-indicator" aria-hidden="true"></span><button type="button" data-go="intro" aria-current="step"><span>01</span>序章</button><button type="button" data-go="welcome"><span>02</span>欢迎</button><button type="button" data-go="login"><span>03</span>登录</button></nav><span class="footer-mark" aria-hidden="true">EST. IN YOUR MOMENTS</span></footer>
    </main>
    <dialog class="glass-dialog" id="info-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-body"><div class="dialog-shimmer" aria-hidden="true"></div><button class="dialog-close icon-button" type="button" id="close-dialog" aria-label="关闭弹窗"><svg><use href="#i-close"/></svg></button><div class="dialog-emblem" id="dialog-emblem"><svg><use href="#i-spark"/></svg></div><p class="eyebrow" id="dialog-eyebrow">ARCHIVE OF MEMORIES</p><h2 id="dialog-title"></h2><p id="dialog-body"></p><button class="primary-button dialog-primary" type="button" id="dialog-primary"><span>知道了</span><svg><use href="#i-arrow"/></svg></button></dialog>
    <noscript><div class="noscript-message">请启用 JavaScript，体验记忆档案馆的页面切换与交互。</div></noscript>
  </body>
</html>
